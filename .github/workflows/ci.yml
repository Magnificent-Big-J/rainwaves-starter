name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, redis, gd, curl, dom, fileinfo
          coverage: none

      - name: Copy environment file
        run: cp .env.example .env

      # Proves the starter installs cleanly from a fresh clone with no local path
      # repositories or machine-specific config (RS-004 stop condition).
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate --ansi

      - name: Pint (code style)
        run: composer lint

      - name: Larastan (static analysis)
        run: composer stan

      - name: PHPUnit
        run: composer test

      - name: Composer audit
        run: composer audit --locked --no-interaction

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: npm audit
        run: npm audit --audit-level=moderate
